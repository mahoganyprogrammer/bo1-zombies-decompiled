name: C/C++ CI (Windows MSVC)
env:
    DXSDK_DIR: 'C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # Pass /WX- to ensure warnings NEVER fail the build, 
      # and /wd4996 to disable the specific strcpy/vsprintf deprecation warnings if desired
      run: cmake -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_CXX_FLAGS="/WX- /wd4996" -DCMAKE_C_FLAGS="/WX- /wd4996"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Game Executable & Assets
      uses: actions/upload-artifact@v4
      with:
        name: BO1Zombies-Release
        path: |
          build/Release/BO1Zombies.exe
          build/Release/*.pdb
          build/Release/mods/
          build/Release/main/
        if-no-files-found: error
