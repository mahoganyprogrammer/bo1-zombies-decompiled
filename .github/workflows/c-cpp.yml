name: C/C++ CI (Windows MSVC)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download and Setup DirectX SDK
      shell: pwsh
      run: |
        $webClient = New-Object System.Net.WebClient
        $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
        $output = "$env:TEMP\DXSDK_Jun10.exe"
        
        Write-Host "Downloading DirectX SDK..."
        $webClient.DownloadFile($url,$output)
        
        Write-Host "Extracting DirectX SDK..."
        # Extract the self-extracting installer silently without launching the GUI wizard
        Start-Process -FilePath $output -ArgumentList "/u /c /q /t:`"$env:TEMP\DXSDK`"" -Wait -NoNewWindow
        
        # Set the DXSDK_DIR environment variable for subsequent steps and CMake
        echo "DXSDK_DIR=$env:TEMP\DXSDK\" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A Win32 -DCMAKE_CXX_FLAGS="/WX- /wd4996" -DCMAKE_C_FLAGS="/WX- /wd4996"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Game Executable & Assets
      uses: actions/upload-artifact@v4
      with:
        name: BO1Zombies-Release
        path: |
          build/Release/BO1Zombies.exe
          build/Release/*.pdb
          build/Release/mods/
          build/Release/main/
        if-no-files-found: error
