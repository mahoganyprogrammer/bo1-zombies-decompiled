name: C/C++ CI (CMake)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # If cmake_files.cmake is a toolchain file:
      run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake_files.cmake -DCMAKE_BUILD_TYPE=Release
      
      # OR: If it's passed as an initial cache script, use -C instead:
      # run: cmake -B build -C cmake_files.cmake -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure
