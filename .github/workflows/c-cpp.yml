name: C/C++ CI (Windows MSVC)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      # Configure for Visual Studio (x86/Win32 as specified in your CMakeLists.txt)
      run: cmake -B build -G "Visual Studio 17 2022" -A Win32

    - name: Build
      run: cmake --build build --config Release
